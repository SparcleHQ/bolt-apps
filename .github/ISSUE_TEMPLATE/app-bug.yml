name: Bug in an app
description: An app in this gallery does the wrong thing. Not for security problems.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security problem? Do not file it here. Email security@sparcle.app (see SECURITY.md)."
  - type: input
    id: app
    attributes:
      label: App id
      placeholder: "clean-list"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bolt version and system
      placeholder: "0.1.174, macOS 15"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did, what you expected, what happened
      description: Made-up data only. Never paste real names, emails, keys or company data.
    validations:
      required: true
