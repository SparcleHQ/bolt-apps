# Runs the Bolt Apps toolkit (lint, check, verify) on every app a pull request changes. A failure
# blocks the merge once "check" is a required status check on main (Settings, Branches).
#
# The toolkit is public and lives in this repository (toolkit/), so this job needs no token and
# runs for pull requests from forks too. Authors can copy the same job into their own repository:
# see kit/ci/bolt-apps-check.yml.
name: check

on:
  pull_request:
    paths: ["apps/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed apps
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          apps="$(git diff --name-only "$base"...HEAD -- apps/ | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Changed apps: ${apps:-none}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: bolt-apps lint, check, verify
        timeout-minutes: 10
        env:
          # Passed as an environment variable, never pasted into the script text, so a folder
          # name cannot be read as shell code.
          APPS: ${{ steps.changed.outputs.apps }}
        run: |
          status=0
          for id in $APPS; do
            if ! printf '%s' "$id" | grep -Eq '^[a-z0-9][a-z0-9-]{0,63}$'; then
              echo "::error::apps/$id is not a valid app folder name"
              status=1
              continue
            fi
            if [ ! -d "apps/$id" ]; then echo "apps/$id removed, nothing to check"; continue; fi
            for cmd in lint check verify; do
              rc=0
              timeout --kill-after=10s 120s ./bolt-apps "$cmd" "apps/$id" || rc=$?
              if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then
                echo "::error file=apps/$id/bolt-app.json::apps/$id: bolt-apps $cmd did not finish within 120 seconds and was stopped"
                status=1
              elif [ "$rc" != 0 ]; then
                echo "::error file=apps/$id/bolt-app.json::apps/$id: bolt-apps $cmd failed or refused the app (exit $rc); the lines above say why"
                status=1
              fi
            done
          done
          exit $status
