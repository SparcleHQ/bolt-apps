# Tests the author toolkit. No secrets, runs on pull requests from anyone.
name: toolkit

on:
  pull_request:
    paths: ["toolkit/**", "apps/**", "schema/**", "kit/**", "docs/**"]
  push:
    branches: [main]
    paths: ["toolkit/**", "kit/**"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the kit's stated minimum. The newest runner image has no 3.9, so it runs on 22.04.
          - { os: ubuntu-22.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: node --test toolkit/test/
      - run: python -m unittest discover -s tests
        working-directory: kit/python
