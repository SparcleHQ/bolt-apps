# Tests the author toolkit. No secrets, runs on pull requests from anyone.
name: toolkit

on:
  pull_request:
    paths: ["toolkit/**", "apps/**", "schema/**", "kit/**", "docs/**"]
  push:
    branches: [main]
    paths: ["toolkit/**", "kit/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: node --test toolkit/test/
      - run: python -m unittest discover -s tests
        working-directory: kit/python
