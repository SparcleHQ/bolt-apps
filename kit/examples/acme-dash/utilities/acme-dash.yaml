            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
