# Generated by: python3 scripts/chart-template__engine.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: chart-template
chip: chart-template
title: "Chart template"
icon: line-chart
description: "Line, bar and sparkline charts from rows or from a number series, plus a cards-only dashboard. Sample data."
placeholder_examples: ["Enter for overview", "bars_rows", "line_rows", "spark_rows", "bars_values", "line_values", "spark_values"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/chart-template__engine.py {{view}} {{arg}} {{scripts_dir}}/chart-template__config.json {{scripts_dir}}/chart-template__fixtures.json {{scripts_dir}}/chart-template__bolt_app_kit.py {{scripts_dir}}/chart-template__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/chart-template__engine.py {{view}} {{arg}} {{scripts_dir}}/chart-template__config.json {{scripts_dir}}/chart-template__fixtures.json {{scripts_dir}}/chart-template__bolt_app_kit.py {{scripts_dir}}/chart-template__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/chart-template__engine.py {{view}} {{arg}} {{scripts_dir}}/chart-template__config.json {{scripts_dir}}/chart-template__fixtures.json {{scripts_dir}}/chart-template__bolt_app_kit.py {{scripts_dir}}/chart-template__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      delta: "{{row.delta}}"
      delta_label: "{{row.since}}"
      max: "{{row.kpi_max}}"
      trend: "{{row.trend}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
      footer: "{{row.kpi_foot}}"
  views:
    overview: {}
    bars_rows:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "bar"
          x: "label"
          y: "value"
          label: "label"
    line_rows:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "line"
          x: "label"
          y: "value"
          label: "label"
    spark_rows:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "sparkline"
          x: "label"
          y: "value"
          label: "label"
    bars_values:
      right_widget:
        kind: chart
        mode: selected_row
        bind:
          type: "bar"
          values: "trend"
          label: "series"
    line_values:
      right_widget:
        kind: chart
        mode: selected_row
        bind:
          type: "line"
          values: "trend"
          label: "series"
    spark_values:
      right_widget:
        kind: chart
        mode: selected_row
        bind:
          type: "sparkline"
          values: "trend"
          label: "series"
    note:
      right_widget:
        kind: markdown
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          body: "{{row.body}}"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
