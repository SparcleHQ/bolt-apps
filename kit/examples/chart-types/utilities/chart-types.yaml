# Generated by: python3 scripts/chart-types__engine.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: chart-types
chip: chart-types
title: "Chart Types"
icon: line-chart
description: "Pie, donut, area, two-line charts, a heatmap and a gauge from rows. Needs Bolt 0.1.182 or newer. Sample data."
placeholder_examples: ["Enter for overview", "pie_rows", "donut_rows", "multi_rows", "area_rows", "heat_rows", "gauge_row"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/chart-types__engine.py {{view}} {{arg}} {{scripts_dir}}/chart-types__config.json {{scripts_dir}}/chart-types__fixtures.json {{scripts_dir}}/chart-types__bolt_app_kit.py"
    linux: "python3 {{scripts_dir}}/chart-types__engine.py {{view}} {{arg}} {{scripts_dir}}/chart-types__config.json {{scripts_dir}}/chart-types__fixtures.json {{scripts_dir}}/chart-types__bolt_app_kit.py"
    windows: "python {{scripts_dir}}/chart-types__engine.py {{view}} {{arg}} {{scripts_dir}}/chart-types__config.json {{scripts_dir}}/chart-types__fixtures.json {{scripts_dir}}/chart-types__bolt_app_kit.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      delta: "{{row.delta}}"
      delta_label: "{{row.since}}"
      max: "{{row.kpi_max}}"
      trend: "{{row.trend}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
      footer: "{{row.kpi_foot}}"
      from:
        set: "tiles"
  views:
    overview: {}
    pie_rows:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "pie"
          x: "label"
          y: "value"
          label: "Deploys by day"
    donut_rows:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "donut"
          x: "label"
          y: "value"
          label: "Deploys by day"
    multi_rows:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "line"
          x: "label"
          label: "Deploys and failures"
          series:
            - { y: "value", label: "Deploys" }
            - { y: "failed", label: "Failed" }
    area_rows:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "area"
          x: "label"
          label: "Deploys and failures"
          series:
            - { y: "value", label: "Deploys" }
            - { y: "failed", label: "Failed" }
          format: "compact"
          digits: 1
          locale: "de-DE"
    heat_rows:
      right_widget:
        kind: heatmap
        mode: list_data
        bind:
          x: "hour"
          y: "day"
          value: "requests"
          label: "Requests per hour"
          unit: " req"
    gauge_row:
      right_widget:
        kind: gauge
        mode: selected_row
        bind:
          value: "{{row.score}}"
          min: "0"
          max: "100"
          label: "{{row.name}}"
          shape: "half"
          thresholds:
            - { at: "0", label: "Low", tone: "error" }
            - { at: "50", label: "Fair", tone: "warn" }
            - { at: "80", label: "Good", tone: "ok" }
    note:
      right_widget:
        kind: markdown
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          body: "{{row.body}}"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
