# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: cloud-cost
chip: cloud-cost
title: "Cloud Cost"
icon: line-chart
description: "Cloud spend: tiles, a savings plan coverage gauge, an area chart with a limit line and marks, team tiles and tables with bars. Needs Bolt 0.1.185 or newer. Sample data."
placeholder_examples: ["Enter for overview", "about"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/cloud-cost__engine.py {{view}} {{arg}} {{scripts_dir}}/cloud-cost__config.json {{scripts_dir}}/cloud-cost__fixtures.json {{scripts_dir}}/cloud-cost__bolt_app_kit.py {{scripts_dir}}/cloud-cost__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/cloud-cost__engine.py {{view}} {{arg}} {{scripts_dir}}/cloud-cost__config.json {{scripts_dir}}/cloud-cost__fixtures.json {{scripts_dir}}/cloud-cost__bolt_app_kit.py {{scripts_dir}}/cloud-cost__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/cloud-cost__engine.py {{view}} {{arg}} {{scripts_dir}}/cloud-cost__config.json {{scripts_dir}}/cloud-cost__fixtures.json {{scripts_dir}}/cloud-cost__bolt_app_kit.py {{scripts_dir}}/cloud-cost__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: tabs
    mode: list_data
    bind:
      tabs:
        - { label: "Overview", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "cards", bind: { layout: "tiles", visual_from: "kpi_visual", title: "{{row.kpi_label}}", value: "{{row.kpi_value}}", unit: "{{row.kpi_unit}}", max: "{{row.kpi_max}}", target: "{{row.target}}", limit: "{{row.limit}}", trend: "{{row.trend}}", delta: "{{row.delta}}", delta_label: "{{row.since}}", subtitle: "{{row.kpi_note}}", from: { set: "tiles" } } }, { kind: "gauge", mode: "selected_row", bind: { value: "{{row.cover}}", min: 0, max: 100, label: "Savings plan coverage", unit: "%", shape: "half", thresholds: [{ at: 60, label: "floor 60%", tone: "warn" }, { at: 80, label: "target 80%", tone: "ok" }] } }, { kind: "chart", bind: { type: "area", x: "m", series: [{ y: "ec2", label: "EC2" }, { y: "rds", label: "RDS" }, { y: "s3", label: "S3" }, { y: "sagemaker", label: "SageMaker" }], unit: "K", label: "Monthly spend by service, $K", limit: 240, limit_label: "cap", marker: { field: "event" }, from: { set: "spend" } } }] } } }
        - { label: "Services", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "table", bind: { columns: [{ field: "service", label: "Service" }, { field: "spend", label: "Spend $", align: "right", format: "compact", total: "sum", bars: true, digits: 1 }, { field: "mom", label: "MoM", align: "right", format: "number", unit: "%", total: "none" }, { field: "status", label: "Trend", mark: "tone" }], from: { set: "services" }, totals_label: "Total" } }] } }, count_from: { set: "services" } }
        - { label: "Teams", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "cards", bind: { layout: "tiles", visual_from: "kpi_visual", title: "{{row.kpi_label}}", value: "{{row.kpi_value}}", unit: "{{row.kpi_unit}}", max: "{{row.kpi_max}}", target: "{{row.target}}", limit: "{{row.limit}}", trend: "{{row.trend}}", delta: "{{row.delta}}", delta_label: "{{row.since}}", subtitle: "{{row.kpi_note}}", from: { set: "team" } } }, { kind: "table", bind: { columns: [{ field: "team", label: "Team" }, { field: "spend", label: "Spend $", align: "right", format: "compact", total: "sum", bars: true, digits: 1 }, { field: "used", label: "Used", align: "right", format: "number", unit: "%", total: "none" }, { field: "status", label: "Flag", mark: "tone" }], from: { set: "team" }, totals_label: "Teams" } }] } }, count_from: { set: "team" } }
        - { label: "Anomalies", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "table", bind: { columns: [{ field: "sd", label: "Service, day" }, { field: "delta", label: "Extra $", align: "right", format: "compact", total: "sum", bars: true, digits: 1 }, { field: "pct", label: "vs usual", align: "right", format: "number", unit: "%", total: "none", digits: 0 }, { field: "status", label: "Flag", mark: "tone" }], from: { set: "anom" }, totals_label: "Anomalies" } }] } }, count_from: { set: "anom" }, status: "warning" }
  views:
    overview: {}
    about:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields: []
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
