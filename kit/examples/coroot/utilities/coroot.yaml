# Generated by: python3 scripts/coroot__app.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: coroot
chip: coroot
title: "Coroot"
icon: Activity
description: "Service health, incidents with root cause, and nodes from a Coroot instance. Ships pointed at the public demo; set COROOT_URL for your own."
placeholder_examples: ["Enter for the overview", "apps checkout", "incidents", "nodes"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
  - { name: arg2, from: "query.word(2)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/coroot__app.py {{view}} {{arg}} {{arg2}} {{scripts_dir}}/coroot__config.json {{scripts_dir}}/coroot__fixtures.json {{scripts_dir}}/coroot__bolt_app_kit.py"
    linux: "python3 {{scripts_dir}}/coroot__app.py {{view}} {{arg}} {{arg2}} {{scripts_dir}}/coroot__config.json {{scripts_dir}}/coroot__fixtures.json {{scripts_dir}}/coroot__bolt_app_kit.py"
    windows: "python {{scripts_dir}}/coroot__app.py {{view}} {{arg}} {{arg2}} {{scripts_dir}}/coroot__config.json {{scripts_dir}}/coroot__fixtures.json {{scripts_dir}}/coroot__bolt_app_kit.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: entity_preview
    mode: selected_row
    bind:
      title: "{{row.title}}"
      subtitle: "{{row.subtitle}}"
      tiles_above:
        title: "{{row.kpi_label}}"
        value: "{{row.kpi_value}}"
        unit: "{{row.kpi_unit}}"
        max: "{{row.kpi_max}}"
        subtitle: "{{row.kpi_note}}"
        badge: "{{row.kpi_badge}}"
        footer: "{{row.kpi_foot}}"
      fields:
        - { label: WHY, value: "{{row.a_why}}" }
        - { label: NAMESPACE, value: "{{row.a_ns}}" }
        - { label: KIND, value: "{{row.a_kind}}" }
        - { label: TYPE, value: "{{row.a_type}}" }
        - { label: LATENCY, value: "{{row.a_latency}}" }
        - { label: ERRORS, value: "{{row.a_errors}}" }
        - { label: UPSTREAMS, value: "{{row.a_up}}" }
        - { label: INSTANCES, value: "{{row.a_inst}}" }
        - { label: RESTARTS, value: "{{row.a_restarts}}" }
        - { label: NETWORK, value: "{{row.a_net}}" }
      body: "{{row.body}}"
      actions:
        - "open"
        - "copy"
        - "triage"
  views:
    overview:
      right_widget:
        kind: cards
        mode: list_data
        bind:
          layout: "tiles"
          title: "{{row.kpi_label}}"
          value: "{{row.kpi_value}}"
          unit: "{{row.kpi_unit}}"
          max: "{{row.kpi_max}}"
          subtitle: "{{row.kpi_note}}"
          badge: "{{row.kpi_badge}}"
          footer: "{{row.kpi_foot}}"
    apps:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: WHY, value: "{{row.a_why}}" }
            - { label: NAMESPACE, value: "{{row.a_ns}}" }
            - { label: KIND, value: "{{row.a_kind}}" }
            - { label: TYPE, value: "{{row.a_type}}" }
            - { label: LATENCY, value: "{{row.a_latency}}" }
            - { label: ERRORS, value: "{{row.a_errors}}" }
            - { label: UPSTREAMS, value: "{{row.a_up}}" }
            - { label: INSTANCES, value: "{{row.a_inst}}" }
            - { label: RESTARTS, value: "{{row.a_restarts}}" }
            - { label: NETWORK, value: "{{row.a_net}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
            - "triage"
    incidents:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: APP, value: "{{row.i_app}}" }
            - { label: SEVERITY, value: "{{row.i_sev}}" }
            - { label: STATE, value: "{{row.i_state}}" }
            - { label: OPENED, value: "{{row.i_opened}}" }
            - { label: DURATION, value: "{{row.i_dur}}" }
            - { label: AVAILABILITY, value: "{{row.i_avail}}" }
            - { label: LATENCY, value: "{{row.i_lat}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
            - "triage"
    nodes:
      right_widget:
        kind: table
        mode: list_data
        bind:
          columns:
            - { field: node, label: Node }
            - { field: cpu, label: CPU, align: right, unit: "%" }
            - { field: mem, label: Memory, align: right, unit: "%" }
            - { field: az, label: Zone }
            - { field: itype, label: Type }
          sort: { field: cpu, dir: desc }
    note:
      right_widget:
        kind: markdown
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          body: "{{row.body}}"
actions:
  - { id: open, kind: url, target: row, label: "Open in Coroot", url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: "Copy summary", insert: "{{row.share_text}}" }
  - { id: triage, kind: composer, target: row, label: "Triage with AI", insert: "{{row.triage_text}}" }
