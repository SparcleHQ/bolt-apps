# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: exec-brief
chip: exec-brief
title: "Executive brief"
icon: activity
description: "Executive brief: four tiles then revenue, cash and customers charts, each titled with its takeaway. Needs Bolt 0.1.184 or newer. Sample data."
placeholder_examples: ["Enter for overview", "about"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/exec-brief__engine.py {{view}} {{arg}} {{scripts_dir}}/exec-brief__config.json {{scripts_dir}}/exec-brief__fixtures.json {{scripts_dir}}/exec-brief__bolt_app_kit.py {{scripts_dir}}/exec-brief__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/exec-brief__engine.py {{view}} {{arg}} {{scripts_dir}}/exec-brief__config.json {{scripts_dir}}/exec-brief__fixtures.json {{scripts_dir}}/exec-brief__bolt_app_kit.py {{scripts_dir}}/exec-brief__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/exec-brief__engine.py {{view}} {{arg}} {{scripts_dir}}/exec-brief__config.json {{scripts_dir}}/exec-brief__fixtures.json {{scripts_dir}}/exec-brief__bolt_app_kit.py {{scripts_dir}}/exec-brief__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: stack
    mode: list_data
    bind:
      children:
        - { kind: "cards", bind: { layout: "tiles", visual_from: "kpi_visual", title: "{{row.kpi_label}}", value: "{{row.kpi_value}}", unit: "{{row.kpi_unit}}", max: "{{row.kpi_max}}", target: "{{row.target}}", limit: "{{row.limit}}", trend: "{{row.trend}}", delta: "{{row.delta}}", delta_label: "{{row.since}}", subtitle: "{{row.kpi_note}}", from: { set: "tiles" } } }
        - { kind: "chart", bind: { type: "line", x: "m", series: [{ y: "rev", label: "Actual" }, { y: "plan", label: "Plan" }], unit: "M", label: "Revenue beat plan in November and December", marker: { field: "event" }, from: { set: "mo" } } }
        - { kind: "chart", bind: { type: "area", x: "m", series: [{ y: "cash", label: "Cash" }], unit: "M", label: "Cash is up 22 percent, runway is not a worry", limit: 20, limit_label: "floor", from: { set: "mo" } } }
        - { kind: "chart", bind: { type: "line", x: "m", series: [{ y: "cust", label: "Customers" }], unit: "", label: "Customers up 42 percent in a year, November was the best month", from: { set: "mo" } } }
  views:
    overview: {}
    about:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields: []
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
