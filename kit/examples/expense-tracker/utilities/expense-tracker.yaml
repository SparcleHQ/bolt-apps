# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: expense-tracker
chip: expense-tracker
title: "Expense tracker"
icon: wallet
description: "Spending summary tiles, expenses by category with a drill, a daily bar chart and a detail pane per expense. Invented sample data."
placeholder_examples: ["Enter for overview", "categories", "expenses", "chart"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/expense-tracker__engine.py {{view}} {{arg}} {{scripts_dir}}/expense-tracker__config.json {{scripts_dir}}/expense-tracker__fixtures.json {{scripts_dir}}/expense-tracker__bolt_app_kit.py {{scripts_dir}}/expense-tracker__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/expense-tracker__engine.py {{view}} {{arg}} {{scripts_dir}}/expense-tracker__config.json {{scripts_dir}}/expense-tracker__fixtures.json {{scripts_dir}}/expense-tracker__bolt_app_kit.py {{scripts_dir}}/expense-tracker__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/expense-tracker__engine.py {{view}} {{arg}} {{scripts_dir}}/expense-tracker__config.json {{scripts_dir}}/expense-tracker__fixtures.json {{scripts_dir}}/expense-tracker__bolt_app_kit.py {{scripts_dir}}/expense-tracker__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  searchable: true
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      max: "{{row.kpi_max}}"
      trend: "{{row.trend}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
      footer: "{{row.kpi_foot}}"
  views:
    overview: {}
    categories:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: "Spent", value: "{{row.f1}}" }
            - { label: "Budget", value: "{{row.f2}}" }
            - { label: "Expenses", value: "{{row.f3}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
    expenses:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: "Date", value: "{{row.f1}}" }
            - { label: "Category", value: "{{row.f2}}" }
            - { label: "Amount", value: "{{row.f3}}" }
            - { label: "Paid with", value: "{{row.f4}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
    chart:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "bar"
          x: "label"
          y: "value"
          label: "label"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
