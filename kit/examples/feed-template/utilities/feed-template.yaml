# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: feed-template
chip: feed-template
title: "Feed template"
icon: globe
description: "Template: a news feed from a list of ids, and a feed keyed by date, from public APIs. Sample data until you set api.fixture_default to false."
placeholder_examples: ["Enter for overview", "news", "asteroids", "sameday"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/feed-template__engine.py {{view}} {{arg}} {{scripts_dir}}/feed-template__config.json {{scripts_dir}}/feed-template__fixtures.json {{scripts_dir}}/feed-template__bolt_app_kit.py {{scripts_dir}}/feed-template__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/feed-template__engine.py {{view}} {{arg}} {{scripts_dir}}/feed-template__config.json {{scripts_dir}}/feed-template__fixtures.json {{scripts_dir}}/feed-template__bolt_app_kit.py {{scripts_dir}}/feed-template__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/feed-template__engine.py {{view}} {{arg}} {{scripts_dir}}/feed-template__config.json {{scripts_dir}}/feed-template__fixtures.json {{scripts_dir}}/feed-template__bolt_app_kit.py {{scripts_dir}}/feed-template__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  searchable: true
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      max: "{{row.kpi_max}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
      footer: "{{row.kpi_foot}}"
  views:
    overview: {}
    news:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: "Points", value: "{{row.f1}}" }
            - { label: "By", value: "{{row.f2}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
    asteroids:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: "Day", value: "{{row.f1}}" }
            - { label: "Miss distance km", value: "{{row.f2}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
    sameday:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields: []
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
