# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: finance-pnl
chip: finance-pnl
title: "Finance P&L"
icon: line-chart
description: "Profit and loss: tiles, an actual vs budget line chart with marks, and a variance table with up and down marks and words. Needs Bolt 0.1.185 or newer. Sample data."
placeholder_examples: ["Enter for overview", "about"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/finance-pnl__engine.py {{view}} {{arg}} {{scripts_dir}}/finance-pnl__config.json {{scripts_dir}}/finance-pnl__fixtures.json {{scripts_dir}}/finance-pnl__bolt_app_kit.py {{scripts_dir}}/finance-pnl__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/finance-pnl__engine.py {{view}} {{arg}} {{scripts_dir}}/finance-pnl__config.json {{scripts_dir}}/finance-pnl__fixtures.json {{scripts_dir}}/finance-pnl__bolt_app_kit.py {{scripts_dir}}/finance-pnl__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/finance-pnl__engine.py {{view}} {{arg}} {{scripts_dir}}/finance-pnl__config.json {{scripts_dir}}/finance-pnl__fixtures.json {{scripts_dir}}/finance-pnl__bolt_app_kit.py {{scripts_dir}}/finance-pnl__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: tabs
    mode: list_data
    bind:
      tabs:
        - { label: "Overview", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "cards", bind: { layout: "tiles", visual_from: "kpi_visual", title: "{{row.kpi_label}}", value: "{{row.kpi_value}}", unit: "{{row.kpi_unit}}", max: "{{row.kpi_max}}", target: "{{row.target}}", limit: "{{row.limit}}", trend: "{{row.trend}}", delta: "{{row.delta}}", delta_label: "{{row.since}}", subtitle: "{{row.kpi_note}}", from: { set: "tiles" } } }, { kind: "chart", bind: { type: "line", x: "m", series: [{ y: "act", label: "Actual" }, { y: "bud", label: "Budget" }], unit: "M", label: "Monthly revenue, actual vs budget, M USD", limit: 24.4, limit_label: "plan ceiling", marker: { field: "event" }, from: { set: "rev" } } }, { kind: "table", bind: { columns: [{ field: "line", label: "Line", total: "count" }, { field: "actual", label: "Actual", align: "right", format: "compact", total: "none", digits: 1 }, { field: "variance", label: "Var", align: "right", format: "compact", total: "none", bars: true, digits: 1 }, { field: "result", label: "Flag", mark: "tone" }], from: { set: "pl" }, totals_label: "Lines, year to date" } }] } } }
        - { label: "Trend", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "gauge", mode: "selected_row", bind: { value: "{{row.gmargin}}", min: 0, max: 40, label: "Operating margin", unit: "%", shape: "half", thresholds: [{ at: 18, label: "floor 18%", tone: "warn" }, { at: 22.1, label: "plan 22.1%", tone: "ok" }] } }, { kind: "chart", bind: { type: "line", x: "m", y: "margin", unit: "%", label: "Operating margin by month, %", limit: 22.1, limit_label: "plan 22.1%", marker: { field: "event" }, from: { set: "mar" } } }, { kind: "chart", bind: { type: "area", x: "m", series: [{ y: "act", label: "Actual" }, { y: "bud", label: "Budget" }], unit: "M", label: "Revenue run rate, $M", from: { set: "rev" } } }] } } }
        - { label: "Detail", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "table", bind: { columns: [{ field: "unit", label: "Unit" }, { field: "actual", label: "Revenue", align: "right", format: "compact", total: "sum", bars: true, digits: 1 }, { field: "variance", label: "Var", align: "right", format: "compact", total: "sum", digits: 1 }, { field: "result", label: "Flag", mark: "tone" }], from: { set: "bu" }, totals_label: "Units" } }] } }, count_from: { set: "bu" } }
  views:
    overview: {}
    about:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields: []
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
