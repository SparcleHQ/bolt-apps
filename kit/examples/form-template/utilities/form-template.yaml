# Generated by: python3 scripts/form-template__engine.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: form-template
chip: form-template
title: "Log expense (form template)"
icon: wallet
description: "A typed input form, then the recent log as a table. Copy it for any app that takes a few typed values."
placeholder_examples: ["Fill the form and press Log expense"]
emits: Generic
inputs:
  - { name: "amount", type: "number", label: "Amount", required: true, min: 0, step: 0.01, placeholder: "42.50" }
  - { name: "category", type: "select", label: "Category", default: "Meals", options: ["Meals", "Travel", "Software", "Office", "Other"] }
  - { name: "date", type: "date", label: "Date", default: "today" }
  - { name: "description", type: "text", label: "Description", placeholder: "Client lunch", max_length: 120 }
  - { name: "billable", type: "toggle", label: "Billable", default: true }
submit:
  label: "Log expense"
bridge:
  command:
    macos: "python3 {{scripts_dir}}/form-template__engine.py {{amount}} {{category}} {{date}} {{description}} {{billable}} {{scripts_dir}}/form-template__config.json {{scripts_dir}}/form-template__fixtures.json {{scripts_dir}}/form-template__bolt_app_kit.py {{scripts_dir}}/form-template__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/form-template__engine.py {{amount}} {{category}} {{date}} {{description}} {{billable}} {{scripts_dir}}/form-template__config.json {{scripts_dir}}/form-template__fixtures.json {{scripts_dir}}/form-template__bolt_app_kit.py {{scripts_dir}}/form-template__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/form-template__engine.py {{amount}} {{category}} {{date}} {{description}} {{billable}} {{scripts_dir}}/form-template__config.json {{scripts_dir}}/form-template__fixtures.json {{scripts_dir}}/form-template__bolt_app_kit.py {{scripts_dir}}/form-template__bolt_app_engine.py"
  parse: json
  timeout_seconds: 10
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  right_widget:
    kind: table
    mode: list_data
    bind:
      columns:
        - { field: "date", label: "Date" }
        - { field: "amount", label: "Amount", align: "right" }
        - { field: "category", label: "Category" }
        - { field: "note", label: "Note" }
        - { field: "billable", label: "Billable" }
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
