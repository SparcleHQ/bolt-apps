# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: gym
chip: gym
title: "Gym and wellness"
icon: activity
description: "Wellness benefit: a ring hero, four tiles, claimed vs an even pace and a claims list. Needs Bolt 0.1.184 or newer. Sample data."
placeholder_examples: ["Enter for overview", "about"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/gym__engine.py {{view}} {{arg}} {{scripts_dir}}/gym__config.json {{scripts_dir}}/gym__fixtures.json {{scripts_dir}}/gym__bolt_app_kit.py {{scripts_dir}}/gym__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/gym__engine.py {{view}} {{arg}} {{scripts_dir}}/gym__config.json {{scripts_dir}}/gym__fixtures.json {{scripts_dir}}/gym__bolt_app_kit.py {{scripts_dir}}/gym__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/gym__engine.py {{view}} {{arg}} {{scripts_dir}}/gym__config.json {{scripts_dir}}/gym__fixtures.json {{scripts_dir}}/gym__bolt_app_kit.py {{scripts_dir}}/gym__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: stack
    mode: list_data
    bind:
      children:
        - { kind: "gauge", mode: "selected_row", bind: { value: "{{row.gused}}", min: 0, max: 100, label: "Wellness benefit used", unit: "%", shape: "ring", thresholds: [{ at: 80, label: "watch 80%", tone: "warn" }] } }
        - { kind: "cards", bind: { layout: "tiles", visual_from: "kpi_visual", title: "{{row.kpi_label}}", value: "{{row.kpi_value}}", unit: "{{row.kpi_unit}}", max: "{{row.kpi_max}}", target: "{{row.target}}", limit: "{{row.limit}}", trend: "{{row.trend}}", delta: "{{row.delta}}", delta_label: "{{row.since}}", subtitle: "{{row.kpi_note}}", from: { set: "tiles" } } }
        - { kind: "chart", bind: { type: "area", x: "m", series: [{ y: "spent", label: "Claimed" }, { y: "pace", label: "Even pace" }], unit: "", label: "Claims ran ahead of an even pace from May, USD", limit: 600, limit_label: "cap", marker: { field: "event" }, from: { set: "mon" } } }
        - { kind: "table", bind: { columns: [{ field: "claim", label: "Claim", total: "count" }, { field: "amount", label: "USD", align: "right", format: "number", total: "none", bars: true }, { field: "status", label: "Flag", mark: "tone" }], from: { set: "claims" }, totals_label: "Claims" } }
  views:
    overview: {}
    about:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields: []
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
