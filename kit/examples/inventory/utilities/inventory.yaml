# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: inventory
chip: inventory
title: "Inventory"
icon: list
description: "A warehouse: bin fill heatmap by aisle and shelf, a low-stock table with bars and marks, and tiles. Needs Bolt 0.1.185 or newer. Sample data."
placeholder_examples: ["Enter for overview", "about"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/inventory__engine.py {{view}} {{arg}} {{scripts_dir}}/inventory__config.json {{scripts_dir}}/inventory__fixtures.json {{scripts_dir}}/inventory__bolt_app_kit.py {{scripts_dir}}/inventory__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/inventory__engine.py {{view}} {{arg}} {{scripts_dir}}/inventory__config.json {{scripts_dir}}/inventory__fixtures.json {{scripts_dir}}/inventory__bolt_app_kit.py {{scripts_dir}}/inventory__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/inventory__engine.py {{view}} {{arg}} {{scripts_dir}}/inventory__config.json {{scripts_dir}}/inventory__fixtures.json {{scripts_dir}}/inventory__bolt_app_kit.py {{scripts_dir}}/inventory__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: tabs
    mode: list_data
    bind:
      tabs:
        - { label: "Floor", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "cards", bind: { layout: "tiles", visual_from: "kpi_visual", title: "{{row.kpi_label}}", value: "{{row.kpi_value}}", unit: "{{row.kpi_unit}}", max: "{{row.kpi_max}}", target: "{{row.target}}", limit: "{{row.limit}}", trend: "{{row.trend}}", delta: "{{row.delta}}", delta_label: "{{row.since}}", subtitle: "{{row.kpi_note}}", from: { set: "tiles" } } }, { kind: "heatmap", bind: { x: "shelf", y: "aisle", value: "fill", label: "Bin fill by aisle and shelf, %", from: { set: "heat" } } }] } } }
        - { label: "Reorder", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "table", bind: { columns: [{ field: "nm", label: "Item" }, { field: "on_hand", label: "On hand", align: "right", format: "number", bars: true, total: "sum" }, { field: "cover", label: "Cover", align: "right", format: "number", digits: 1, unit: "d", total: "none" }, { field: "status", label: "Flag", mark: "tone" }], from: { set: "low" }, totals_label: "Low stock" } }] } }, count_from: { set: "low" }, status: "warning" }
        - { label: "Movement", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "chart", bind: { type: "line", x: "w", series: [{ y: "inb", label: "Received" }, { y: "out", label: "Shipped" }], unit: "", label: "Units received and shipped per week", limit: 1500, limit_label: "dock capacity", marker: { field: "event" }, from: { set: "move" } } }, { kind: "table", bind: { columns: [{ field: "cat", label: "Category" }, { field: "skus", label: "SKUs", align: "right", format: "number", total: "sum" }, { field: "value", label: "Value", align: "right", format: "compact", bars: true, total: "sum", digits: 1 }, { field: "status", label: "Cover", mark: "tone" }], from: { set: "cat" }, totals_label: "Categories" } }] } } }
  views:
    overview: {}
    about:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields: []
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
