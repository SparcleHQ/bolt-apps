# Generated by: python3 scripts/json-tree-browser__engine.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: json-tree-browser
chip: json-tree-browser
title: "JSON tree browser"
icon: binary
description: "Pick a document, browse any JSON as a collapsible tree. Replace the sample documents with the answer of any JSON API."
placeholder_examples: ["Enter for overview", "docs"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/json-tree-browser__engine.py {{view}} {{arg}} {{scripts_dir}}/json-tree-browser__config.json {{scripts_dir}}/json-tree-browser__fixtures.json {{scripts_dir}}/json-tree-browser__bolt_app_kit.py {{scripts_dir}}/json-tree-browser__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/json-tree-browser__engine.py {{view}} {{arg}} {{scripts_dir}}/json-tree-browser__config.json {{scripts_dir}}/json-tree-browser__fixtures.json {{scripts_dir}}/json-tree-browser__bolt_app_kit.py {{scripts_dir}}/json-tree-browser__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/json-tree-browser__engine.py {{view}} {{arg}} {{scripts_dir}}/json-tree-browser__config.json {{scripts_dir}}/json-tree-browser__fixtures.json {{scripts_dir}}/json-tree-browser__bolt_app_kit.py {{scripts_dir}}/json-tree-browser__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  searchable: true
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      max: "{{row.kpi_max}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
      footer: "{{row.kpi_foot}}"
  views:
    overview: {}
    docs:
      right_widget:
        kind: json_tree
        mode: selected_row
        bind:
          source: "data"
    note:
      right_widget:
        kind: markdown
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          body: "{{row.body}}"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
