# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: lookup-template
chip: lookup-template
title: "Forecast lookup"
icon: cloud-sun
description: "Type a place, get its weather. One query in, a list with a preview pane out, from two keyless Open-Meteo calls."
placeholder_examples: ["New York", "Paris", "Tokyo"]
emits: Generic
args:
  - { name: q1, from: "query.word(0)", default: "-" }
  - { name: q2, from: "query.word(1)", default: "-" }
  - { name: q3, from: "query.word(2)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/lookup-template__engine.py {{q1}} {{q2}} {{q3}} {{scripts_dir}}/lookup-template__config.json {{scripts_dir}}/lookup-template__fixtures.json {{scripts_dir}}/lookup-template__bolt_app_kit.py {{scripts_dir}}/lookup-template__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/lookup-template__engine.py {{q1}} {{q2}} {{q3}} {{scripts_dir}}/lookup-template__config.json {{scripts_dir}}/lookup-template__fixtures.json {{scripts_dir}}/lookup-template__bolt_app_kit.py {{scripts_dir}}/lookup-template__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/lookup-template__engine.py {{q1}} {{q2}} {{q3}} {{scripts_dir}}/lookup-template__config.json {{scripts_dir}}/lookup-template__fixtures.json {{scripts_dir}}/lookup-template__bolt_app_kit.py {{scripts_dir}}/lookup-template__bolt_app_engine.py"
  parse: json
  timeout_seconds: 20
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  right_widget:
    kind: entity_preview
    mode: selected_row
    bind:
      title: "{{row.title}}"
      subtitle: "{{row.subtitle}}"
      tiles_above:
        title: "{{row.kpi_label}}"
        value: "{{row.kpi_value}}"
        unit: "{{row.kpi_unit}}"
        max: "{{row.kpi_max}}"
        trend: "{{row.trend}}"
        subtitle: "{{row.kpi_note}}"
        badge: "{{row.kpi_badge}}"
        footer: "{{row.kpi_foot}}"
      body: "{{row.body}}"
      actions:
        - "open"
        - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
