# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: marketing-campaigns
chip: marketing-campaigns
title: "Marketing Campaigns"
icon: list
description: "Campaigns in four tabs with counts and a watch list status: a channel donut, tiles and tables with bars. Needs Bolt 0.1.185 or newer. Sample data."
placeholder_examples: ["Enter for overview", "about"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/marketing-campaigns__engine.py {{view}} {{arg}} {{scripts_dir}}/marketing-campaigns__config.json {{scripts_dir}}/marketing-campaigns__fixtures.json {{scripts_dir}}/marketing-campaigns__bolt_app_kit.py {{scripts_dir}}/marketing-campaigns__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/marketing-campaigns__engine.py {{view}} {{arg}} {{scripts_dir}}/marketing-campaigns__config.json {{scripts_dir}}/marketing-campaigns__fixtures.json {{scripts_dir}}/marketing-campaigns__bolt_app_kit.py {{scripts_dir}}/marketing-campaigns__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/marketing-campaigns__engine.py {{view}} {{arg}} {{scripts_dir}}/marketing-campaigns__config.json {{scripts_dir}}/marketing-campaigns__fixtures.json {{scripts_dir}}/marketing-campaigns__bolt_app_kit.py {{scripts_dir}}/marketing-campaigns__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: tabs
    mode: list_data
    bind:
      tabs:
        - { label: "Overview", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "cards", bind: { layout: "tiles", visual_from: "kpi_visual", title: "{{row.kpi_label}}", value: "{{row.kpi_value}}", unit: "{{row.kpi_unit}}", max: "{{row.kpi_max}}", target: "{{row.target}}", limit: "{{row.limit}}", trend: "{{row.trend}}", delta: "{{row.delta}}", delta_label: "{{row.since}}", subtitle: "{{row.kpi_note}}", from: { set: "tiles" } } }, { kind: "chart", bind: { type: "donut", x: "ch", y: "spend", unit: "", label: "Spend by channel, USD", from: { set: "chan" } } }, { kind: "chart", bind: { type: "line", x: "w", label: "Weekly spend (k USD) and conversions", limit: 66.9, limit_label: "cap", marker: { field: "event" }, from: { set: "wk" }, series: [{ y: "spend", label: "Spend k" }, { y: "conv", label: "Conv per 100" }] } }] } } }
        - { label: "Campaigns", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "table", bind: { columns: [{ field: "nm", label: "Campaign" }, { field: "spend", label: "Spend", align: "right", format: "compact", bars: true, total: "sum", digits: 1 }, { field: "rev", label: "Revenue", align: "right", format: "compact", total: "sum", digits: 1 }, { field: "roi", label: "ROI", align: "right", format: "number", digits: 0, unit: "%", total: "none" }], from: { set: "camps" }, totals_label: "Campaigns" } }] } }, count_from: { set: "camps" } }
        - { label: "Creatives", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "table", bind: { columns: [{ field: "creative", label: "Creative" }, { field: "impressions", label: "Views", align: "right", format: "compact", bars: true, total: "sum", digits: 0 }, { field: "ctr", label: "CTR", align: "right", format: "number", unit: "%", digits: 1, total: "none" }, { field: "spend", label: "Spend", align: "right", format: "compact", total: "sum", digits: 1 }], from: { set: "creatives" }, totals_label: "Creatives" } }] } }, count_from: { set: "creatives" } }
        - { label: "Watch", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "table", bind: { columns: [{ field: "nm", label: "Campaign" }, { field: "spend", label: "Spend", align: "right", format: "compact", bars: true, total: "sum", digits: 1 }, { field: "roi", label: "ROI", align: "right", format: "number", digits: 0, unit: "%", total: "none" }, { field: "flag", label: "Flag", mark: "tone" }], from: { set: "watch" }, totals_label: "Watch list" } }] } }, count_from: { set: "watch" }, status: "warning" }
  views:
    overview: {}
    about:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields: []
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
