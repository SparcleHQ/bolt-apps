# Generated by: python3 scripts/obs__app.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: obs
chip: obs
title: "Observability"
icon: Activity
description: "One view over your monitoring tools: services, firing alerts and incidents from every source, joined by service name. Ships on public demos; add your own in ~/.config/obs/sources.json."
placeholder_examples: ["Enter for the overview", "services bad", "services cross", "alerts", "sources"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
  - { name: arg2, from: "query.word(2)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/obs__app.py {{view}} {{arg}} {{arg2}} {{scripts_dir}}/obs__config.json {{scripts_dir}}/obs__fixtures.json {{scripts_dir}}/obs__bolt_app_kit.py"
    linux: "python3 {{scripts_dir}}/obs__app.py {{view}} {{arg}} {{arg2}} {{scripts_dir}}/obs__config.json {{scripts_dir}}/obs__fixtures.json {{scripts_dir}}/obs__bolt_app_kit.py"
    windows: "python {{scripts_dir}}/obs__app.py {{view}} {{arg}} {{arg2}} {{scripts_dir}}/obs__config.json {{scripts_dir}}/obs__fixtures.json {{scripts_dir}}/obs__bolt_app_kit.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: entity_preview
    mode: selected_row
    bind:
      title: "{{row.title}}"
      subtitle: "{{row.subtitle}}"
      tiles_above:
        title: "{{row.kpi_label}}"
        value: "{{row.kpi_value}}"
        unit: "{{row.kpi_unit}}"
        max: "{{row.kpi_max}}"
        subtitle: "{{row.kpi_note}}"
        badge: "{{row.kpi_badge}}"
        footer: "{{row.kpi_foot}}"
      fields:
        - { label: STATUS, value: "{{row.s_status}}" }
        - { label: SOURCES, value: "{{row.s_sources}}" }
        - { label: FIRING, value: "{{row.s_alerts}}" }
        - { label: SIGNAL, value: "{{row.s_signal}}" }
      body: "{{row.body}}"
      actions:
        - "open"
        - "logs"
        - "traces"
        - "copy"
        - "triage"
  views:
    overview:
      right_widget:
        kind: cards
        mode: list_data
        bind:
          layout: "tiles"
          title: "{{row.kpi_label}}"
          value: "{{row.kpi_value}}"
          unit: "{{row.kpi_unit}}"
          max: "{{row.kpi_max}}"
          subtitle: "{{row.kpi_note}}"
          badge: "{{row.kpi_badge}}"
          footer: "{{row.kpi_foot}}"
    services:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: STATUS, value: "{{row.s_status}}" }
            - { label: SOURCES, value: "{{row.s_sources}}" }
            - { label: FIRING, value: "{{row.s_alerts}}" }
            - { label: SIGNAL, value: "{{row.s_signal}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "logs"
            - "traces"
            - "copy"
            - "triage"
    service:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: STATUS, value: "{{row.s_status}}" }
            - { label: SOURCES, value: "{{row.s_sources}}" }
            - { label: FIRING, value: "{{row.s_alerts}}" }
            - { label: SIGNAL, value: "{{row.s_signal}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "logs"
            - "traces"
            - "copy"
            - "triage"
    alerts:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: STATUS, value: "{{row.s_status}}" }
            - { label: SOURCES, value: "{{row.s_sources}}" }
            - { label: FIRING, value: "{{row.s_alerts}}" }
            - { label: SIGNAL, value: "{{row.s_signal}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "logs"
            - "traces"
            - "copy"
            - "triage"
    trend:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: line
          x: t
          y: v
          label: "Trend, last 3 hours"
    sources:
      right_widget:
        kind: table
        mode: list_data
        bind:
          columns:
            - { field: node, label: Source }
            - { field: kind, label: Type }
            - { field: state, label: State }
            - { field: services, label: Services, align: right }
            - { field: alerts, label: Firing, align: right }
            - { field: ms, label: Ms, align: right }
    note:
      right_widget:
        kind: markdown
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          body: "{{row.body}}"
actions:
  - { id: open, kind: url, target: row, label: "Open", url_template: "{{row.open_url}}" }
  - { id: logs, kind: url, target: row, label: "Logs", url_template: "{{row.logs_url}}" }
  - { id: traces, kind: url, target: row, label: "Traces", url_template: "{{row.traces_url}}" }
  - { id: copy, kind: composer, target: row, label: "Copy summary", insert: "{{row.share_text}}" }
  - { id: triage, kind: composer, target: row, label: "Triage with AI", insert: "{{row.triage_text}}" }
