# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: pipeline-board
chip: pipeline-board
title: "Pipeline board"
icon: git-commit
description: "Runs grouped by stage, a detail pane per run and a line diff of what changed. Invented sample data."
placeholder_examples: ["Enter for overview", "stages", "runs", "changes"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/pipeline-board__engine.py {{view}} {{arg}} {{scripts_dir}}/pipeline-board__config.json {{scripts_dir}}/pipeline-board__fixtures.json {{scripts_dir}}/pipeline-board__bolt_app_kit.py {{scripts_dir}}/pipeline-board__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/pipeline-board__engine.py {{view}} {{arg}} {{scripts_dir}}/pipeline-board__config.json {{scripts_dir}}/pipeline-board__fixtures.json {{scripts_dir}}/pipeline-board__bolt_app_kit.py {{scripts_dir}}/pipeline-board__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/pipeline-board__engine.py {{view}} {{arg}} {{scripts_dir}}/pipeline-board__config.json {{scripts_dir}}/pipeline-board__fixtures.json {{scripts_dir}}/pipeline-board__bolt_app_kit.py {{scripts_dir}}/pipeline-board__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  searchable: true
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      max: "{{row.kpi_max}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
      footer: "{{row.kpi_foot}}"
  views:
    overview: {}
    stages:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: "Stage", value: "{{row.f1}}" }
            - { label: "Runs", value: "{{row.f2}}" }
            - { label: "Typical time", value: "{{row.f3}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
    runs:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: "State", value: "{{row.f1}}" }
            - { label: "Stage", value: "{{row.f2}}" }
            - { label: "Branch", value: "{{row.f3}}" }
            - { label: "Author", value: "{{row.f4}}" }
            - { label: "Commit", value: "{{row.f5}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
    changes:
      right_widget:
        kind: detail
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          fields:
            - { label: "Before", value: "{{row.change_before}}" }
            - { label: "After", value: "{{row.change_after}}" }
            - { label: "What changed", value: "{{row.change_note}}" }
    note:
      right_widget:
        kind: markdown
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          body: "{{row.body}}"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
