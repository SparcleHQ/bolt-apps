# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: places-list
chip: places-list
title: "Places list"
icon: MapPin
description: "Places as rows with an Open button that opens each one in an online map. No map widget: a personal app cannot draw one. Invented places."
placeholder_examples: ["Enter for overview", "places"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/places-list__engine.py {{view}} {{arg}} {{scripts_dir}}/places-list__config.json {{scripts_dir}}/places-list__fixtures.json {{scripts_dir}}/places-list__bolt_app_kit.py {{scripts_dir}}/places-list__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/places-list__engine.py {{view}} {{arg}} {{scripts_dir}}/places-list__config.json {{scripts_dir}}/places-list__fixtures.json {{scripts_dir}}/places-list__bolt_app_kit.py {{scripts_dir}}/places-list__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/places-list__engine.py {{view}} {{arg}} {{scripts_dir}}/places-list__config.json {{scripts_dir}}/places-list__fixtures.json {{scripts_dir}}/places-list__bolt_app_kit.py {{scripts_dir}}/places-list__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  searchable: true
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      max: "{{row.kpi_max}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
      footer: "{{row.kpi_foot}}"
  views:
    overview: {}
    places:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: "Kind", value: "{{row.f1}}" }
            - { label: "Distance", value: "{{row.f2}}" }
            - { label: "Open now", value: "{{row.f3}}" }
            - { label: "Latitude", value: "{{row.f4}}" }
            - { label: "Longitude", value: "{{row.f5}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
