# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: portal-template
chip: portal-template
title: "Example portal"
icon: globe
description: "Template: tiles, drill down and back, a detail panel, cache with stale fallback. Change config.json to point it at your API."
placeholder_examples: ["Enter for overview", "projects", "tickets"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/portal-template__engine.py {{view}} {{arg}} {{scripts_dir}}/portal-template__config.json {{scripts_dir}}/portal-template__fixtures.json {{scripts_dir}}/portal-template__bolt_app_kit.py {{scripts_dir}}/portal-template__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/portal-template__engine.py {{view}} {{arg}} {{scripts_dir}}/portal-template__config.json {{scripts_dir}}/portal-template__fixtures.json {{scripts_dir}}/portal-template__bolt_app_kit.py {{scripts_dir}}/portal-template__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/portal-template__engine.py {{view}} {{arg}} {{scripts_dir}}/portal-template__config.json {{scripts_dir}}/portal-template__fixtures.json {{scripts_dir}}/portal-template__bolt_app_kit.py {{scripts_dir}}/portal-template__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: entity_preview
    mode: selected_row
    bind:
      title: "{{row.title}}"
      subtitle: "{{row.subtitle}}"
      tiles_above:
        title: "{{row.kpi_label}}"
        value: "{{row.kpi_value}}"
        unit: "{{row.kpi_unit}}"
        max: "{{row.kpi_max}}"
        trend: "{{row.trend}}"
        subtitle: "{{row.kpi_note}}"
        badge: "{{row.kpi_badge}}"
        footer: "{{row.kpi_foot}}"
      body: "{{row.body}}"
      actions:
        - "open"
        - "copy"
  views:
    overview: {}
    projects:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: "Status", value: "{{row.f1}}" }
            - { label: "Lead", value: "{{row.f2}}" }
            - { label: "Tags", value: "{{row.f3}}", kind: "chips" }
            - { label: "Started", value: "{{row.f4}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
    tickets:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: "Status", value: "{{row.f1}}" }
            - { label: "Assignee", value: "{{row.f2}}" }
            - { label: "Project", value: "{{row.f3}}" }
            - { label: "Priority", value: "{{row.f4}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
