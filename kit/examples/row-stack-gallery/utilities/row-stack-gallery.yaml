# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: row-stack-gallery
chip: row-stack-gallery
title: "Row Stack Gallery"
icon: list
description: "Pick a service and its right pane has its own tabs: details, history and notes, bound to the row you selected. Needs Bolt 0.1.185 or newer. Sample data."
placeholder_examples: ["Enter for overview", "weekly"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/row-stack-gallery__engine.py {{view}} {{arg}} {{scripts_dir}}/row-stack-gallery__config.json {{scripts_dir}}/row-stack-gallery__fixtures.json {{scripts_dir}}/row-stack-gallery__bolt_app_kit.py {{scripts_dir}}/row-stack-gallery__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/row-stack-gallery__engine.py {{view}} {{arg}} {{scripts_dir}}/row-stack-gallery__config.json {{scripts_dir}}/row-stack-gallery__fixtures.json {{scripts_dir}}/row-stack-gallery__bolt_app_kit.py {{scripts_dir}}/row-stack-gallery__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/row-stack-gallery__engine.py {{view}} {{arg}} {{scripts_dir}}/row-stack-gallery__config.json {{scripts_dir}}/row-stack-gallery__fixtures.json {{scripts_dir}}/row-stack-gallery__bolt_app_kit.py {{scripts_dir}}/row-stack-gallery__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: tabs
    mode: selected_row
    bind:
      tabs:
        - { label: "Details", widget: { kind: "stack", bind: { children: [{ kind: "detail", bind: { title: "{{row.title}}", subtitle: "{{row.subtitle}}", fields: [{ label: "Level", value: "{{row.level}}" }, { label: "Score", value: "{{row.score}}" }] } }, { kind: "gauge", bind: { value: "{{row.score}}", max: "100", label: "Health" } }] } } }
        - { label: "History", count_from: { set: "hist", where: { h_src: "{{row.source}}" } }, widget: { kind: "chart", bind: { type: "line", x: "h_label", y: "h_value", label: "Alerts for this service", from: { set: "hist", where: { h_src: "{{row.source}}" } } } } }
        - { label: "Notes", widget: { kind: "markdown", mode: "selected_row", bind: { title: "Runbook", body: "{{row.notes}}" } } }
  views:
    overview: {}
    weekly:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "line"
          x: "label"
          y: "value"
          label: "Deploys by day"
    note:
      right_widget:
        kind: markdown
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          body: "{{row.body}}"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
