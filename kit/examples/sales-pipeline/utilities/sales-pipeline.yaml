# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: sales-pipeline
chip: sales-pipeline
title: "Sales pipeline"
icon: trending-up
description: "Sales pipeline: a wide area chart first, tiles, a stage funnel table with bars and a top deals list. Needs Bolt 0.1.184 or newer. Sample data."
placeholder_examples: ["Enter for overview", "about"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/sales-pipeline__engine.py {{view}} {{arg}} {{scripts_dir}}/sales-pipeline__config.json {{scripts_dir}}/sales-pipeline__fixtures.json {{scripts_dir}}/sales-pipeline__bolt_app_kit.py {{scripts_dir}}/sales-pipeline__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/sales-pipeline__engine.py {{view}} {{arg}} {{scripts_dir}}/sales-pipeline__config.json {{scripts_dir}}/sales-pipeline__fixtures.json {{scripts_dir}}/sales-pipeline__bolt_app_kit.py {{scripts_dir}}/sales-pipeline__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/sales-pipeline__engine.py {{view}} {{arg}} {{scripts_dir}}/sales-pipeline__config.json {{scripts_dir}}/sales-pipeline__fixtures.json {{scripts_dir}}/sales-pipeline__bolt_app_kit.py {{scripts_dir}}/sales-pipeline__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: stack
    mode: list_data
    bind:
      children:
        - { kind: "chart", bind: { type: "area", x: "w", series: [{ y: "open", label: "Open" }, { y: "commit", label: "Commit" }], unit: "M", label: "Open pipeline grew 41% in 12 weeks, commit kept pace (M USD)", limit: 5.2, limit_label: "quota x3", marker: { field: "event" }, from: { set: "wk" } } }
        - { kind: "cards", bind: { layout: "tiles", visual_from: "kpi_visual", title: "{{row.kpi_label}}", value: "{{row.kpi_value}}", unit: "{{row.kpi_unit}}", max: "{{row.kpi_max}}", target: "{{row.target}}", limit: "{{row.limit}}", trend: "{{row.trend}}", delta: "{{row.delta}}", delta_label: "{{row.since}}", subtitle: "{{row.kpi_note}}", from: { set: "tiles" } } }
        - { kind: "table", bind: { columns: [{ field: "stage", label: "Stage", total: "count" }, { field: "deals", label: "Deals", align: "right", format: "number", bars: true, total: "none" }, { field: "value", label: "M USD", align: "right", format: "number", digits: 1, total: "none" }, { field: "flag", label: "Flag", mark: "tone" }], from: { set: "stages" }, totals_label: "Funnel" } }
        - { kind: "table", bind: { columns: [{ field: "deal", label: "Top deals" }, { field: "amount", label: "k USD", align: "right", format: "number", bars: true, total: "sum" }, { field: "idle", label: "Idle d", align: "right", format: "number", total: "none" }, { field: "flag", label: "Flag", mark: "tone" }], from: { set: "deals" }, totals_label: "Top 10" } }
  views:
    overview: {}
    about:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields: []
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
