# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: security-posture
chip: security-posture
title: "Security Posture"
icon: activity
description: "Open findings: a fix-time gauge with a target, a team by severity heatmap, tiles and a table with age bars and severity marks. Needs Bolt 0.1.185 or newer. Sample data."
placeholder_examples: ["Enter for overview", "about"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/security-posture__engine.py {{view}} {{arg}} {{scripts_dir}}/security-posture__config.json {{scripts_dir}}/security-posture__fixtures.json {{scripts_dir}}/security-posture__bolt_app_kit.py {{scripts_dir}}/security-posture__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/security-posture__engine.py {{view}} {{arg}} {{scripts_dir}}/security-posture__config.json {{scripts_dir}}/security-posture__fixtures.json {{scripts_dir}}/security-posture__bolt_app_kit.py {{scripts_dir}}/security-posture__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/security-posture__engine.py {{view}} {{arg}} {{scripts_dir}}/security-posture__config.json {{scripts_dir}}/security-posture__fixtures.json {{scripts_dir}}/security-posture__bolt_app_kit.py {{scripts_dir}}/security-posture__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: tabs
    mode: list_data
    bind:
      tabs:
        - { label: "Posture", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "cards", bind: { layout: "tiles", visual_from: "kpi_visual", title: "{{row.kpi_label}}", value: "{{row.kpi_value}}", unit: "{{row.kpi_unit}}", max: "{{row.kpi_max}}", target: "{{row.target}}", limit: "{{row.limit}}", trend: "{{row.trend}}", delta: "{{row.delta}}", delta_label: "{{row.since}}", subtitle: "{{row.kpi_note}}", from: { set: "tiles" } } }, { kind: "gauge", mode: "selected_row", bind: { value: "{{row.gttf}}", min: 0, max: 28, label: "Median days to fix", unit: " d", shape: "half", thresholds: [{ at: 14, label: "target 14 d", tone: "warn" }, { at: 21, label: "over 21 d", tone: "error" }] } }, { kind: "heatmap", bind: { x: "sevname", y: "team", value: "n", label: "Open findings by team and severity", from: { set: "heat" } } }] } } }
        - { label: "Findings", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "table", bind: { columns: [{ field: "sidl", label: "Finding", total: "count" }, { field: "age", label: "Age", align: "right", format: "number", unit: "d", bars: true, total: "none" }, { field: "sev", label: "Flag", mark: "tone" }], from: { set: "cve" }, totals_label: "Findings" } }] } }, count_from: { set: "cve" }, status: "critical" }
        - { label: "Trend", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "chart", bind: { type: "line", x: "w", y: "open", label: "Open findings, last 13 weeks", limit: 25, limit_label: "goal 25", marker: { field: "event" }, from: { set: "weeks" } } }, { kind: "table", bind: { columns: [{ field: "sev", label: "Level", total: "count" }, { field: "mttf", label: "Days", align: "right", format: "number", digits: 1, unit: "d", bars: true, total: "none" }, { field: "target", label: "Target", align: "right", format: "number", unit: "d", total: "none" }, { field: "status", label: "Flag", mark: "tone" }], from: { set: "ttf" }, totals_label: "Levels" } }] } } }
  views:
    overview: {}
    about:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields: []
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
