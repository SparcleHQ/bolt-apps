# Generated by: python3 scripts/showcase-ops__engine.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: showcase-ops
chip: showcase-ops
title: "Observability showcase"
icon: activity
description: "A fictional service estate as tiles: error budget ring, CPU against a limit as a bullet with a target mark, p99 latency with a dashed limit and the SLO as a plain meter. Needs Bolt 0.1.184. Invented sample data, no network."
placeholder_examples: ["Enter for overview", "services", "alerts", "budget", "capacity"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/showcase-ops__engine.py {{view}} {{arg}} {{scripts_dir}}/showcase-ops__config.json {{scripts_dir}}/showcase-ops__fixtures.json {{scripts_dir}}/showcase-ops__bolt_app_kit.py {{scripts_dir}}/showcase-ops__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/showcase-ops__engine.py {{view}} {{arg}} {{scripts_dir}}/showcase-ops__config.json {{scripts_dir}}/showcase-ops__fixtures.json {{scripts_dir}}/showcase-ops__bolt_app_kit.py {{scripts_dir}}/showcase-ops__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/showcase-ops__engine.py {{view}} {{arg}} {{scripts_dir}}/showcase-ops__config.json {{scripts_dir}}/showcase-ops__fixtures.json {{scripts_dir}}/showcase-ops__bolt_app_kit.py {{scripts_dir}}/showcase-ops__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  searchable: true
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      max: "{{row.kpi_max}}"
      trend: "{{row.trend}}"
      limit: "{{row.limit}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
      footer: "{{row.kpi_foot}}"
      visual_from: "kpi_visual"
      target: "{{row.target}}"
  views:
    overview: {}
    services:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: "State", value: "{{row.f1}}" }
            - { label: "Team", value: "{{row.f2}}" }
            - { label: "CPU", value: "{{row.f3}}" }
            - { label: "p99", value: "{{row.f4}}" }
            - { label: "Error budget", value: "{{row.f5}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
    alerts:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: "Severity", value: "{{row.f1}}" }
            - { label: "Service", value: "{{row.f2}}" }
            - { label: "State", value: "{{row.f3}}" }
            - { label: "Open for", value: "{{row.f4}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
    budget:
      right_widget:
        kind: cards
        mode: list_data
        bind:
          layout: "tiles"
          visual: "ring"
          title: "{{row.name}}"
          value: "{{row.value}}"
          max: 100
          unit: "%"
          subtitle: "{{row.note}}"
    capacity:
      right_widget:
        kind: cards
        mode: list_data
        bind:
          layout: "tiles"
          visual: "bullet"
          title: "{{row.name}}"
          value: "{{row.value}}"
          max: "{{row.max}}"
          target: "{{row.target}}"
          unit: "core"
          subtitle: "{{row.note}}"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
