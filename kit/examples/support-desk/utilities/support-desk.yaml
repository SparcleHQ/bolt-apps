# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: support-desk
chip: support-desk
title: "Support Desk"
icon: list
description: "A support queue in four tabs: Queue, SLA, Volume and Agents, with counts and a status on the SLA tab. Needs Bolt 0.1.185 or newer. Sample data."
placeholder_examples: ["Enter for overview", "about"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/support-desk__engine.py {{view}} {{arg}} {{scripts_dir}}/support-desk__config.json {{scripts_dir}}/support-desk__fixtures.json {{scripts_dir}}/support-desk__bolt_app_kit.py {{scripts_dir}}/support-desk__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/support-desk__engine.py {{view}} {{arg}} {{scripts_dir}}/support-desk__config.json {{scripts_dir}}/support-desk__fixtures.json {{scripts_dir}}/support-desk__bolt_app_kit.py {{scripts_dir}}/support-desk__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/support-desk__engine.py {{view}} {{arg}} {{scripts_dir}}/support-desk__config.json {{scripts_dir}}/support-desk__fixtures.json {{scripts_dir}}/support-desk__bolt_app_kit.py {{scripts_dir}}/support-desk__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: tabs
    mode: list_data
    bind:
      tabs:
        - { label: "Queue", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "cards", bind: { layout: "tiles", visual_from: "kpi_visual", title: "{{row.kpi_label}}", value: "{{row.kpi_value}}", unit: "{{row.kpi_unit}}", max: "{{row.kpi_max}}", target: "{{row.target}}", limit: "{{row.limit}}", trend: "{{row.trend}}", delta: "{{row.delta}}", delta_label: "{{row.since}}", subtitle: "{{row.kpi_note}}", from: { set: "tiles" } } }, { kind: "table", bind: { columns: [{ field: "tsubj", label: "Ticket", total: "count" }, { field: "age", label: "Age", align: "right", format: "number", unit: "h", bars: true, total: "none" }, { field: "sla", label: "SLA", mark: "tone" }], from: { set: "tickets" }, totals_label: "Tickets" } }] } }, count_from: { set: "tickets" } }
        - { label: "SLA", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "gauge", mode: "selected_row", bind: { value: "{{row.slag}}", min: 0, max: 100, label: "SLA met, this week", unit: "%", shape: "half", thresholds: [{ at: 85, label: "floor 85%", tone: "warn" }, { at: 95, label: "target 95%", tone: "ok" }] } }, { kind: "chart", bind: { type: "bar", x: "d", y: "met", label: "SLA met per day, Mon to Sun, %", limit: 95, limit_label: "target 95%", marker: { field: "event" }, from: { set: "sladay" } } }, { kind: "table", bind: { columns: [{ field: "tsubj", label: "Ticket", total: "count" }, { field: "left_h", label: "Left", align: "right", format: "number", digits: 1, unit: "h", total: "none" }, { field: "sla", label: "SLA", mark: "tone" }], from: { set: "risk" }, totals_label: "At risk" } }] } }, count_from: { set: "risk" }, status: "critical" }
        - { label: "Volume", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "chart", bind: { type: "line", x: "d", y: "n", label: "New tickets per day, last 14 days", limit: 50, limit_label: "staffed capacity", marker: { field: "event" }, from: { set: "vol" } } }, { kind: "table", bind: { columns: [{ field: "ch", label: "Channel" }, { field: "tickets", label: "Tickets", align: "right", format: "number", bars: true, total: "sum" }, { field: "reply", label: "Reply", align: "right", format: "number", digits: 1, unit: "h", total: "none" }, { field: "speed", label: "Speed", mark: "tone" }], from: { set: "chan" }, totals_label: "Channels" } }] } }, count_from: { set: "chan" } }
        - { label: "Agents", widget: { kind: "stack", mode: "list_data", bind: { children: [{ kind: "cards", bind: { layout: "tiles", visual_from: "kpi_visual", title: "{{row.kpi_label}}", value: "{{row.kpi_value}}", unit: "{{row.kpi_unit}}", max: "{{row.kpi_max}}", target: "{{row.target}}", limit: "{{row.limit}}", trend: "{{row.trend}}", delta: "{{row.delta}}", delta_label: "{{row.since}}", subtitle: "{{row.kpi_note}}", from: { set: "agents" } } }, { kind: "table", bind: { columns: [{ field: "agent", label: "Agent" }, { field: "open", label: "Open", align: "right", format: "number", bars: true, total: "sum" }, { field: "avg", label: "Avg h", align: "right", format: "number", digits: 1, total: "none" }, { field: "load", label: "Load", mark: "tone" }], from: { set: "agents" }, totals_label: "Agents" } }] } }, count_from: { set: "agents" } }
  views:
    overview: {}
    about:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields: []
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
