# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: table-template
chip: table-template
title: "Table template"
icon: list
description: "A sortable table with totals, number formats and a share column. Sample data."
placeholder_examples: ["Enter for overview", "orders", "shares"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/table-template__engine.py {{view}} {{arg}} {{scripts_dir}}/table-template__config.json {{scripts_dir}}/table-template__fixtures.json {{scripts_dir}}/table-template__bolt_app_kit.py {{scripts_dir}}/table-template__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/table-template__engine.py {{view}} {{arg}} {{scripts_dir}}/table-template__config.json {{scripts_dir}}/table-template__fixtures.json {{scripts_dir}}/table-template__bolt_app_kit.py {{scripts_dir}}/table-template__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/table-template__engine.py {{view}} {{arg}} {{scripts_dir}}/table-template__config.json {{scripts_dir}}/table-template__fixtures.json {{scripts_dir}}/table-template__bolt_app_kit.py {{scripts_dir}}/table-template__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  searchable: true
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      max: "{{row.kpi_max}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
      footer: "{{row.kpi_foot}}"
  views:
    overview: {}
    orders:
      right_widget:
        kind: table
        mode: list_data
        bind:
          sort:
            field: "amount"
            dir: "desc"
          totals_label: "Total"
          columns:
            - { field: "id", label: "Order", total: "count" }
            - { field: "customer", label: "Customer" }
            - { field: "product", label: "Product" }
            - { field: "qty", label: "Qty", align: "right", total: "sum", format: "number" }
            - { field: "amount", label: "Amount", align: "right", total: "sum", format: "currency", unit: "USD" }
            - { field: "placed", label: "Placed", format: "date" }
            - { field: "status", label: "Status" }
    shares:
      right_widget:
        kind: table
        mode: list_data
        bind:
          sort:
            field: "share"
            dir: "desc"
          totals_label: "Total"
          columns:
            - { field: "region", label: "Region", total: "count" }
            - { field: "amount", label: "Amount", align: "right", total: "sum", format: "currency", unit: "USD" }
            - { field: "share", label: "Share", align: "right", total: "sum", format: "percent" }
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
