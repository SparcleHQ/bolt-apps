# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: tabs-gallery
chip: tabs-gallery
title: "Tabs Gallery"
icon: list
description: "One right pane with three tabs over the same rows: a line, a pie and a table. Needs Bolt 0.1.185 or newer. Sample data."
placeholder_examples: ["Enter for overview", "tabs_rows"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/tabs-gallery__engine.py {{view}} {{arg}} {{scripts_dir}}/tabs-gallery__config.json {{scripts_dir}}/tabs-gallery__fixtures.json {{scripts_dir}}/tabs-gallery__bolt_app_kit.py {{scripts_dir}}/tabs-gallery__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/tabs-gallery__engine.py {{view}} {{arg}} {{scripts_dir}}/tabs-gallery__config.json {{scripts_dir}}/tabs-gallery__fixtures.json {{scripts_dir}}/tabs-gallery__bolt_app_kit.py {{scripts_dir}}/tabs-gallery__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/tabs-gallery__engine.py {{view}} {{arg}} {{scripts_dir}}/tabs-gallery__config.json {{scripts_dir}}/tabs-gallery__fixtures.json {{scripts_dir}}/tabs-gallery__bolt_app_kit.py {{scripts_dir}}/tabs-gallery__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      delta: "{{row.delta}}"
      delta_label: "{{row.since}}"
      max: "{{row.kpi_max}}"
      trend: "{{row.trend}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
      footer: "{{row.kpi_foot}}"
  views:
    overview: {}
    tabs_rows:
      right_widget:
        kind: tabs
        mode: list_data
        bind:
          tabs:
            - { label: "Trend", widget: { kind: "chart", mode: "list_data", bind: { type: "line", x: "label", y: "value", label: "Deploys by day" } } }
            - { label: "Share", widget: { kind: "chart", mode: "list_data", bind: { type: "pie", x: "label", y: "value", label: "Deploys by day" } } }
            - { label: "Rows", widget: { kind: "table", mode: "list_data", bind: {  } } }
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
