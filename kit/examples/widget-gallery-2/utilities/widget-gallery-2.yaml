# Generated by: ./bolt-apps regen <app folder> (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: widget-gallery-2
chip: widget-gallery-2
title: "Widget gallery 2"
icon: Image
description: "The card pane, the image grid, the cards grid with images and the service map graph. Sample data: generated colour swatches as inline images and six invented services."
placeholder_examples: ["Enter for overview", "card", "grid", "cardsimg", "graph"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/widget-gallery-2__engine.py {{view}} {{arg}} {{scripts_dir}}/widget-gallery-2__config.json {{scripts_dir}}/widget-gallery-2__fixtures.json {{scripts_dir}}/widget-gallery-2__bolt_app_kit.py {{scripts_dir}}/widget-gallery-2__bolt_app_engine.py"
    linux: "python3 {{scripts_dir}}/widget-gallery-2__engine.py {{view}} {{arg}} {{scripts_dir}}/widget-gallery-2__config.json {{scripts_dir}}/widget-gallery-2__fixtures.json {{scripts_dir}}/widget-gallery-2__bolt_app_kit.py {{scripts_dir}}/widget-gallery-2__bolt_app_engine.py"
    windows: "python {{scripts_dir}}/widget-gallery-2__engine.py {{view}} {{arg}} {{scripts_dir}}/widget-gallery-2__config.json {{scripts_dir}}/widget-gallery-2__fixtures.json {{scripts_dir}}/widget-gallery-2__bolt_app_kit.py {{scripts_dir}}/widget-gallery-2__bolt_app_engine.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      delta: "{{row.delta}}"
      delta_label: "{{row.since}}"
      max: "{{row.kpi_max}}"
      trend: "{{row.trend}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
      footer: "{{row.kpi_foot}}"
  views:
    overview: {}
    card:
      right_widget:
        kind: card
        mode: selected_row
        bind:
          title: "{{row.name}}"
          subtitle: "{{row.note}}"
          actions:
            - "copy"
    grid:
      right_widget:
        kind: image_grid
        mode: list_data
        bind:
          src: "{{row.src}}"
          caption: "{{row.name}}"
          alt: "{{row.name}} swatch"
          columns: 3
    cardsimg:
      right_widget:
        kind: cards
        mode: list_data
        bind:
          layout: "grid"
          title: "{{row.name}}"
          subtitle: "{{row.hex}}"
          image: "{{row.src}}"
          footer: "{{row.uses}} uses"
    graph:
      right_widget:
        kind: graph
        mode: list_data
        bind:
          id: "id"
          label: "name"
          status: "state"
          to: "calls"
          group: "team"
          title: "Service map"
    note:
      right_widget:
        kind: markdown
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          body: "{{row.body}}"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
