# Generated by: python3 scripts/widget-gallery__engine.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: widget-gallery
chip: widget-gallery
title: "Widget gallery"
icon: activity
description: "One screen per right-hand pane the launcher can draw for an app: tiles, chart, table, detail, JSON tree, diff, preview and markdown. Sample data."
placeholder_examples: ["Enter for overview", "chart", "table", "detail", "tree", "diff", "preview"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/widget-gallery__engine.py {{view}} {{arg}} {{scripts_dir}}/widget-gallery__config.json {{scripts_dir}}/widget-gallery__fixtures.json {{scripts_dir}}/widget-gallery__bolt_app_kit.py"
    linux: "python3 {{scripts_dir}}/widget-gallery__engine.py {{view}} {{arg}} {{scripts_dir}}/widget-gallery__config.json {{scripts_dir}}/widget-gallery__fixtures.json {{scripts_dir}}/widget-gallery__bolt_app_kit.py"
    windows: "python {{scripts_dir}}/widget-gallery__engine.py {{view}} {{arg}} {{scripts_dir}}/widget-gallery__config.json {{scripts_dir}}/widget-gallery__fixtures.json {{scripts_dir}}/widget-gallery__bolt_app_kit.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  searchable: true
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      delta: "{{row.delta}}"
      delta_label: "{{row.since}}"
      max: "{{row.kpi_max}}"
      trend: "{{row.trend}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
      footer: "{{row.kpi_foot}}"
  views:
    overview: {}
    chart:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "bar"
          x: "label"
          y: "value"
          label: "label"
    table:
      right_widget:
        kind: table
        mode: list_data
        bind:
          sort:
            field: "commits"
            dir: "desc"
          totals_label: "Total"
          activate:
            nav:
              view: "detail"
              arg: "{{row.service}}"
          columns:
            - { field: "service", label: "Service", total: "count" }
            - { field: "lang", label: "Lang" }
            - { field: "status", label: "Status" }
            - { field: "commits", label: "Commits", align: "right", total: "sum" }
            - { field: "open_prs", label: "PRs", align: "right", total: "sum" }
    detail:
      right_widget:
        kind: detail
        mode: selected_row
        bind:
          title: "{{row.service}}"
          subtitle: "{{row.version}} · {{row.region}}"
          fields:
            - { label: "Status", value: "{{row.status}}" }
            - { label: "Version", value: "{{row.version}}", copy: true }
            - { label: "Region", value: "{{row.region}}" }
            - { label: "Replicas", value: "{{row.replicas}}" }
            - { label: "Uptime", value: "{{row.uptime}}" }
            - { label: "CPU", value: "{{row.cpu}}" }
            - { label: "Memory", value: "{{row.memory}}" }
            - { label: "Endpoint", value: "{{row.endpoint}}", copy: true }
            - { label: "Owner", value: "{{row.owner}}" }
    tree:
      right_widget:
        kind: json_tree
        mode: selected_row
        bind:
          source: "data"
    diff:
      right_widget:
        kind: diff
        mode: selected_row
        bind:
          left: "{{row.left}}"
          right: "{{row.right}}"
          leftLabel: "prod"
          rightLabel: "staging"
    preview:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          tiles_above:
            title: "{{row.kpi_label}}"
            value: "{{row.kpi_value}}"
            unit: "{{row.kpi_unit}}"
            max: "{{row.kpi_max}}"
            subtitle: "{{row.kpi_note}}"
            badge: "{{row.kpi_badge}}"
            footer: "{{row.kpi_foot}}"
          fields:
            - { label: "Plan", value: "{{row.f1}}" }
            - { label: "Region", value: "{{row.f2}}" }
            - { label: "Owner", value: "{{row.f3}}" }
            - { label: "Tags", value: "{{row.f4}}", kind: "chips" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
    markdown:
      right_widget:
        kind: markdown
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          body: "{{row.body}}"
          actions:
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
