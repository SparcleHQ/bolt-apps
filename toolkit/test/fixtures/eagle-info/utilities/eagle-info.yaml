schema_version: 1
runtime: bridge
id: eagle-info
chip: eagle
title: Eagle info
description: Fixture app shaped like a real script app (helper package, several hosts)
emits: Document
args:
  - { name: q, from: "query.word(0)", default: "nest" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/eagle_info.py {{q}}"
    linux: "python3 {{scripts_dir}}/eagle_info.py {{q}}"
    windows: "python {{scripts_dir}}/eagle_info.py {{q}}"
  parse: json
  timeout_seconds: 20
presentation: { widget: list, title_field: title }
permissions:
  exec:
    - program: python3
      args:
        - ["{{scripts_dir}}/eagle_info.py", { arg: q }]
    - program: python
      args:
        - ["{{scripts_dir}}/eagle_info.py", { arg: q }]
  files: { read: [scripts] }
  network:
    - { host: api.example.invalid }
    - { host: birds.example.invalid }
    - { host: nests.example.invalid }
    - { host: maps.example.invalid }
    - { host: photos.example.invalid }
    - { host: stats.example.invalid }
    - { host: cdn.example.invalid }
